[project]
name = "bkk-traffic-forecasting"
version = "1.0.0"
description = "One-Hour-Ahead Bangkok Traffic Congestion Forecasting and Factor Analysis (CSS 342)"
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
full = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pydeck>=0.9.0",
]

[project.scripts]
bkk-pipeline = "run_pipeline:app"
