[project]
name = "bkk-traffic-forecasting-mlops"
version = "2.0.0"
description = "One-Hour-Ahead Bangkok Traffic Congestion Forecasting & MLOps Platform (CSS 342)"
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
    "joblib>=1.3.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.5.0",
]

[project.scripts]
bkk-mlops = "run_pipeline:app"
