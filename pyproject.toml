[project]
name = "bkk-traffic-eda"
version = "1.0.0"
description = "Exploratory Data Analysis & Statistical Visualization for Bangkok Traffic Congestion (DuckDB + Seaborn)"
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "duckdb>=1.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fonttools>=4.40.0",
]

[project.scripts]
bkk-eda = "src.eda.run_eda:main"
