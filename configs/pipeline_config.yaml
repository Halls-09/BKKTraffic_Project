# ==============================================================================
# Bangkok Traffic Congestion Forecasting (1-Hour Ahead) - Master MLOps Config
# Real iTIC + Open-Meteo + Traffy Fondue + Calendar (CSS 342 KMUTT)
# ==============================================================================

project:
  name: "bkk-traffic-forecasting-mlops"
  version: "2.1.0"
  random_seed: 42
  timezone: "Asia/Bangkok"
  forecast_horizon_hours: 1

paths:
  raw_zips_glob: "data/CleanData_BKK-*.zip"
  gold_data: "data/04_gold/real_link_hourly_features.pkl"
  models_dir: "artifacts/models"
  evaluation_dir: "artifacts/evaluation"
  charts_dir: "artifacts/charts"
  registry_dir: "artifacts/registry"
  monitoring_dir: "artifacts/monitoring"
  lineage_dir: "artifacts/lineage"
  dashboard_html: "artifacts/dashboard_index.html"
  model_card_md: "MODEL_CARD.md"

dataset:
  min_completeness: 0.80
  max_links: 500
  require_location_join_coverage: true  # Proposal 4.2: every link must exist in Location Table
  exclude_self_loops: true              # Exclude from_loc == to_loc
  congestion_threshold: 0.50
  onset_freeflow_max: 0.35

feature_engineering:
  use_categorical_ids: true
  enabled_groups:
    group_1_current_lags: true
    group_2_historical_profile: true
    group_3_temporal_cyclical: true
    group_4_calendar: true
    group_5_weather: true
    group_6_spatial_graph: true
    group_7_road_traffy_static: true

model:
  algorithm: "lightgbm_regressor"
  sample_weights:
    onset_boost: 0.50
    rainy_boost: 0.25
  hyperparameters:
    n_estimators: 800
    learning_rate: 0.03
    max_depth: 8
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 0.5
    reg_lambda: 2.0
    early_stopping_rounds: 50
    random_state: 42
    n_jobs: -1
  threshold_tuning:
    search_min: 0.25
    search_max: 0.60
    num_steps: 71
    min_onset_recall_guardrail: 0.55

registry:
  # Proposal Section 10 Page 11: delta_F1 >= +0.01, onset_recall drop <= 0.02, rainy F1 non-degradation
  promotion_rules:
    min_f1_improvement_over_baseline: 0.01
    min_onset_recall: 0.55
    max_onset_recall_drop_vs_champion: 0.02
    max_mae: 0.15
    max_allowed_f1_regression_vs_champion: 0.01

monitoring:
  psi_bins: 10
  psi_warning_threshold: 0.10
  psi_critical_threshold: 0.25
  f1_degradation_alert_delta: 0.05
  onset_recall_floor: 0.50
  segment_max_missing_rate_24h: 0.20
  monitored_features:
    - "red_rate_t0"
    - "precip_mm_t0"
    - "precip_3h_mm_t0"
    - "downstream_red_rate_t0"
    - "district_red_rate_t0"
    - "current_diff_from_hist"
